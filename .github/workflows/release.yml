name: Release

# Pushing a tag like v0.3.0 builds the Linux binary and a .deb package and attaches them
# to a GitHub release.
# Only the system the program is actually used and tested on is published.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="marp-order-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md README.pt-BR.md LICENSE "$name/"
          cp "target/${{ matrix.target }}/release/marp-order" "$name/"
          tar czf "$name.tar.gz" "$name"
      - name: Debian package
        run: sh packaging/build-deb.sh "target/${{ matrix.target }}/release/marp-order" "${GITHUB_REF_NAME#v}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            marp-order-*.tar.gz
            marp-order_*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

  crates-io:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Skipped until a crates.io token is stored in the CARGO_REGISTRY_TOKEN secret.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set; skipping crates.io."
          else
            cargo publish --locked
          fi
