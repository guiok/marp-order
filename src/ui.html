<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>marp-order</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f3f4f6; --panel: #ffffff; --text: #1f2933; --muted: #6b7280;
    --line: #d9dde3; --accent: #2563eb; --accent-soft: #dbeafe;
    --warn: #b45309; --warn-soft: #fef3c7; --danger: #b91c1c; --danger-soft: #fee2e2;
    --w: 260px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181d; --panel: #20242b; --text: #e5e7eb; --muted: #9aa3af;
      --line: #343a44; --accent: #60a5fa; --accent-soft: #1e3a5f;
      --warn: #fbbf24; --warn-soft: #453508; --danger: #f87171; --danger-soft: #4c1d1d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* the bar and the warnings stay visible when the page is scrolled */
  #top { position: sticky; top: 0; z-index: 10; background: var(--bg); }
  header { background: var(--panel);
           border-bottom: 1px solid var(--line); padding: 8px 16px;
           display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  #tabs { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px; padding: 6px 16px 0; }
  .tab { display: flex; align-items: center; gap: 4px; padding: 5px 6px 5px 12px; max-width: 34ch;
         border: 1px solid var(--line); border-bottom: 0; border-radius: 8px 8px 0 0;
         color: var(--muted); cursor: pointer; }
  .tab.on { background: var(--panel); color: var(--text); font-weight: 600; }
  .tab .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab.dirty .name::after { content: ' •'; color: var(--warn); }
  #autolabel { margin: 0 8px 4px auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  #lang { margin: 0 0 4px 0; font: inherit; font-size: 12px; border: 1px solid var(--line); border-radius: 6px;
          background: var(--panel); color: var(--text); }
  .tab .x, #open { border: 0; background: none; padding: 1px 6px; color: inherit; }
  #open { margin-bottom: 4px; color: var(--accent); }
  .nodoc header, .nodoc #grid, .nodoc .help { display: none; }
  #empty { padding: 48px 16px; text-align: center; color: var(--muted); }
  #info { color: var(--muted); margin-right: auto; }
  #info .dirty { color: var(--warn); font-weight: 600; }
  button { font: inherit; color: var(--text); background: var(--panel);
           border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  label.size { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .banner { margin: 8px 16px; padding: 8px 12px; border-radius: 6px;
            display: flex; align-items: center; gap: 12px; }
  .banner[hidden] { display: none; }
  .banner span { flex: 1; }
  .banner.warn { background: var(--warn-soft); color: var(--warn); }
  .banner.danger { background: var(--danger-soft); color: var(--danger); }
  #grid { position: relative; display: grid; gap: 14px; padding: 16px;
          grid-template-columns: repeat(auto-fill, minmax(var(--w), 1fr)); user-select: none; }
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 8px;
          overflow: hidden; cursor: grab; display: flex; flex-direction: column; }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .card.dragging { opacity: .35; }
  .card.dim { opacity: .28; }
  .tab.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
  #find { font: inherit; width: 15ch; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px;
          background: var(--bg); color: var(--text); }
  .card img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #fff;
              pointer-events: none; }
  .card .text { aspect-ratio: 16 / 9; padding: 10px 12px; overflow: hidden; white-space: pre-wrap;
                font: 11px/1.35 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); }
  .card footer { display: flex; align-items: baseline; gap: 6px; padding: 6px 8px;
                 border-top: 1px solid var(--line); }
  .num { font-weight: 700; min-width: 1.6em; }
  .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title.empty { color: var(--muted); font-style: italic; }
  .was { color: var(--accent); font-size: 12px; white-space: nowrap; }
  .flag { color: var(--warn); cursor: help; }
  #bar { position: absolute; width: 4px; border-radius: 2px; background: var(--accent);
         pointer-events: none; display: none; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
           background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 6px;
           opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  #toast.show { opacity: 1; }
  .card .face { position: relative; }
  .card .edited { display: none; position: absolute; left: 6px; top: 6px; padding: 1px 7px;
                  border-radius: 10px; background: var(--warn); color: #fff; font-size: 11px; font-weight: 600; }
  .card.changed .edited { display: block; }
  dialog { border: 1px solid var(--line); border-radius: 10px; padding: 0; width: min(1500px, 96vw);
           background: var(--panel); color: var(--text); }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; }
  .bar .grow { flex: 1; color: var(--muted); font-size: 12px; }
  .bar .grow.error { color: var(--danger); }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 14px;
           border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  @media (max-width: 900px) { .panes { grid-template-columns: 1fr; } }
  .edside { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; min-width: 0; }
  .edwrap { position: relative; flex: 1; display: flex; }
  #edtext, #edhl, #ednotes { margin: 0; padding: 10px; border-radius: 6px; border: 1px solid var(--line);
            tab-size: 2; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
            white-space: pre-wrap; overflow-wrap: break-word; }
  /* the visible text is the coloured <pre> underneath; the text area on top is transparent */
  #edhl { position: absolute; inset: 0; overflow-y: scroll; pointer-events: none;
          background: var(--bg); color: var(--text); }
  #edtext { position: relative; flex: 1; min-height: 50vh; resize: vertical; overflow-y: scroll;
            background: transparent; color: transparent; caret-color: var(--text); }
  #edtext::selection { background: var(--accent-soft); }
  #ednotes { min-height: 9vh; resize: vertical; background: var(--bg); color: var(--text); }
  .edside label { font-size: 12px; color: var(--muted); }
  .hl-hd { color: var(--accent); }
  .hl-cm { color: var(--muted); font-style: italic; }
  .hl-code { color: var(--warn); }
  .hl-mk, .hl-hr { color: var(--danger); }
  .hl-lk { color: var(--accent); text-decoration: underline; }
  .head #ednotes, .head .edside label, .head #edprev, .head #ednext { display: none; }
  #edview { position: relative; margin: 12px 0; align-self: start; aspect-ratio: 16 / 9;
            border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fff; }
  #edview iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #edview iframe.loading { opacity: 0; }
  .help { color: var(--muted); padding: 0 16px 20px; font-size: 12px; }
  #opener { width: min(900px, 96vw); }
  #opener .panes { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 50vh; padding-bottom: 12px; }
  #opener h2 { font-size: 13px; margin: 12px 0 6px; color: var(--muted); }
  #opener ul { list-style: none; margin: 0; padding: 0; max-height: 56vh; overflow: auto; }
  #opener li button { width: 100%; text-align: left; border: 0; border-radius: 4px; padding: 4px 8px;
                      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #opener li button:hover { background: var(--accent-soft); }
  #opener li small { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  #opform { display: flex; gap: 6px; margin-bottom: 6px; }
  #oppath { flex: 1; font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px;
            background: var(--bg); color: var(--text); }
  #operror { color: var(--danger); margin: 6px 0 0; }
  #differ { width: min(1100px, 96vw); }
  #differ select { font: inherit; max-width: 30ch; }
  #dfrows { display: grid; gap: 8px; max-height: 74vh; overflow: auto; padding: 10px 14px;
            border-top: 1px solid var(--line); }
  .dfrow { display: grid; grid-template-columns: 1fr 140px 1fr; gap: 10px; align-items: center;
           padding: 6px; border-radius: 8px; }
  .dfrow.same { opacity: .55; }
  .dfrow.changed { background: var(--warn-soft); }
  .dfrow.left { background: var(--danger-soft); }
  .dfrow.right { background: var(--accent-soft); }
  .dfrow .mid { display: grid; gap: 4px; justify-items: center; font-size: 12px; color: var(--muted); }
  .mini { width: 100%; max-width: 230px; background: var(--panel); border: 1px solid var(--line);
          border-radius: 6px; overflow: hidden; }
  .mini:first-child { justify-self: end; }
  .mini img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #fff; }
  .mini .text { aspect-ratio: 16 / 9; padding: 8px 10px; overflow: hidden; white-space: pre-wrap;
                font: 10px/1.35 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); }
  .mini footer { display: flex; gap: 6px; padding: 4px 8px; border-top: 1px solid var(--line); font-size: 12px; }
  .dfrow details { grid-column: 1 / -1; font-size: 12px; }
  .dfdiff { margin-top: 6px; padding: 8px; border-radius: 4px; background: var(--panel);
            font: 11px/1.45 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; }
  .dfdiff div { padding: 0 4px; min-height: 1.45em; }
  .dfdiff .del { background: var(--danger-soft); }
  .dfdiff .add { background: var(--accent-soft); }
  .dfdiff .del::before { content: '− '; }
  .dfdiff .add::before { content: '+ '; }
  .dfrow.head { grid-template-columns: 1fr; background: var(--warn-soft); font-size: 12px; }
  kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--panel); }
</style>
</head>
<body>
<div id="top">
<nav id="tabs"><button id="open" data-tt="Open a file (Ctrl+O)" data-t="+ Open"></button>
  <label id="autolabel" data-tt="Reload the file by itself when it changes on disk and nothing is unsaved here"><input type="checkbox" id="auto" checked> <span data-t="Auto-reload"></span></label>
  <select id="lang" data-tt="Language" aria-label="Language"><option value="en">EN</option><option value="pt">PT</option></select></nav>
<header>
  <span id="info"></span>
  <input id="find" type="search" data-tp="Find…" data-tt="Find slides by text (Ctrl+F)" aria-label="Find slides">
  <label class="size"><span data-t="Size"></span> <input id="size" type="range" min="140" max="520" step="20" value="260"></label>
  <button id="undo" data-tt="Undo (Ctrl+Z)" data-t="↶ Undo"></button>
  <button id="redo" data-tt="Redo (Ctrl+Y)" data-t="↷ Redo"></button>
  <button id="dup" data-tt="Duplicate selected (Ctrl+D)" data-t="Duplicate"></button>
  <button id="del" data-tt="Remove selected (Delete)" data-t="Remove"></button>
  <button id="fm" data-tt="Edit the front matter (theme and global settings)" data-t="Front matter"></button>
  <button id="compare" data-tt="Compare with another open file and merge slides" data-t="Compare…"></button>
  <button id="discard" data-tt="Go back to what is saved in the file" data-t="Discard"></button>
  <button id="save" class="primary" data-tt="Write the changes to the file (Ctrl+S)"></button>
</header>

<div id="external" class="banner warn" hidden>
  <span></span>
  <button id="reload" data-t="Reload from disk (Ctrl+R)"></button>
</div>
<div id="mismatch" class="banner danger" hidden><span></span></div>
<div id="thumbnote" class="banner warn" hidden><span></span><button id="rethumb" data-t="Try again"></button></div>
<div id="offline" class="banner danger" hidden><span data-t="marp-order has stopped. Start it again to continue."></span></div>

</div>

<p id="empty" hidden><span data-t="No file open."></span> <button id="openempty" data-t="Open a presentation…"></button></p>
<main id="grid"><div id="bar"></div></main>

<p class="help" data-t="help"></p>

<dialog id="editor">
  <div class="bar">
    <button id="edprev" data-tt="Previous slide (Alt+←)">◀</button>
    <strong id="edtitle"></strong>
    <button id="ednext" data-tt="Next slide (Alt+→)">▶</button>
    <span id="edstatus" class="grow"></span>
  </div>
  <div class="panes">
    <div class="edside">
      <div class="edwrap">
        <pre id="edhl" aria-hidden="true"></pre>
        <textarea id="edtext" spellcheck="false" aria-label="Slide Markdown"></textarea>
      </div>
      <label for="ednotes" data-t="Speaker notes"></label>
      <textarea id="ednotes" spellcheck="false"></textarea>
    </div>
    <div id="edview"></div>
  </div>
  <div class="bar">
    <span id="edhelp" class="grow"></span>
    <button id="edcancel" data-t="Cancel"></button>
    <button id="edapply" class="primary"></button>
  </div>
</dialog>
<dialog id="opener">
  <div class="bar"><strong data-t="Open a presentation"></strong><span class="grow"></span><button id="opclose" data-t="Close"></button></div>
  <div class="panes">
    <section>
      <h2 data-t="Recent"></h2>
      <ul id="oprecent"></ul>
    </section>
    <section>
      <h2 data-t="Browse"></h2>
      <form id="opform">
        <input id="oppath" spellcheck="false" aria-label="Folder or file path">
        <button data-t="Go"></button>
      </form>
      <ul id="oplist"></ul>
      <p id="operror"></p>
    </section>
  </div>
</dialog>

<dialog id="differ">
  <div class="bar">
    <strong data-t="Compare"></strong> <span id="dfleft"></span> <span data-t="with"></span> <select id="dfother" aria-label="Other file"></select>
    <span id="dfsummary" class="grow"></span>
    <label><input type="checkbox" id="dfonly"> <span data-t="only differences"></span></label>
    <button id="dfundo" data-t="↶ Undo"></button>
    <button id="dfall" data-tt="Make the slides of this file match the other file" data-t="Take all from other"></button>
    <button id="dfclose" class="primary" data-t="Done"></button>
  </div>
  <div id="dfrows"></div>
</dialog>
<div id="toast"></div>

<script>
'use strict';

// <pure> Functions without DOM or state; tested in tests/ui_logic.test.js.

const norm = (text) => text.replace(/\r\n/g, '\n').trim();

/** Title of a slide: the first Markdown heading or, failing that, the first line of text. */
function slideTitle(text) {
  let fallback = '';
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line || line.startsWith('<') || line.startsWith('![') || line.startsWith('```')) continue;
    const heading = line.match(/^#{1,6}\s+(.*)$/);
    const clean = (heading ? heading[1] : line).replace(/\*\*|__|`/g, '').trim();
    if (heading) return clean;
    fallback = fallback || clean;
  }
  return fallback;
}

/** Longest-common-subsequence table: `t[i][j]` is the length for `a[i..]` and `b[j..]`. */
function lcsTable(a, b) {
  const t = Array.from({ length: a.length + 1 }, () => new Uint32Array(b.length + 1));
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = b.length - 1; j >= 0; j--) {
      t[i][j] = a[i] === b[j] ? t[i + 1][j + 1] + 1 : Math.max(t[i + 1][j], t[i][j + 1]);
    }
  }
  return t;
}

/** From 0 to 1: share of the non-empty lines the two texts have in common. */
function similarity(a, b) {
  const lines = (text) => norm(text).split('\n').map((l) => l.trim()).filter(Boolean);
  const x = lines(a), y = lines(b);
  if (!x.length && !y.length) return 1;
  return 2 * lcsTable(x, y)[0][0] / (x.length + y.length);
}

/** Line-by-line difference: `same`, `del` (only in `a`) and `add` (only in `b`). */
function lineDiff(a, b) {
  const x = norm(a).split('\n'), y = norm(b).split('\n');
  const t = lcsTable(x, y), out = [];
  let i = 0, j = 0;
  while (i < x.length || j < y.length) {
    if (i < x.length && j < y.length && x[i] === y[j]) { out.push({ kind: 'same', text: x[i] }); i++; j++; }
    else if (j < y.length && (i === x.length || t[i][j + 1] > t[i + 1][j])) out.push({ kind: 'add', text: y[j++] });
    else out.push({ kind: 'del', text: x[i++] });
  }
  return out;
}

/**
 * Aligns two lists of slides (`{text, title}`) by the longest common subsequence of their texts.
 * Returns rows `same`, `changed` (same title or similar text), `left` (only in the first)
 * and `right` (only in the second; `at` is where it would go in the first).
 */
function alignSlides(left, right) {
  const a = left.map((s) => norm(s.text)), b = right.map((s) => norm(s.text));
  const n = a.length, m = b.length, t = lcsTable(a, b);
  const pair = (l, r) => (left[l].title && left[l].title === right[r].title) || similarity(a[l], b[r]) >= 0.5;
  const rows = [];
  let onlyL = [], onlyR = [], i = 0, j = 0;
  const flush = () => {
    let next = 0;
    for (const l of onlyL) {
      const hit = onlyR.findIndex((r, q) => q >= next && pair(l, r));
      if (hit < 0) { rows.push({ kind: 'left', l }); continue; }
      for (; next < hit; next++) rows.push({ kind: 'right', r: onlyR[next], at: l });
      rows.push({ kind: 'changed', l, r: onlyR[hit] });
      next = hit + 1;
    }
    for (; next < onlyR.length; next++) rows.push({ kind: 'right', r: onlyR[next], at: i });
    onlyL = []; onlyR = [];
  };
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { flush(); rows.push({ kind: 'same', l: i++, r: j++ }); }
    else if (j < m && (i === n || t[i][j + 1] >= t[i + 1][j])) onlyR.push(j++);
    else onlyL.push(i++);
  }
  flush();
  return rows;
}

const DIRECTIVES = new Set(['marp', 'theme', 'style', 'headingdivider', 'size', 'math', 'title', 'author',
  'description', 'keywords', 'url', 'image', 'lang', 'paginate', 'header', 'footer', 'class', 'color',
  'backgroundcolor', 'backgroundimage', 'backgroundposition', 'backgroundrepeat', 'backgroundsize', 'transition']);

/** A comment with nothing but `key: value` Marp directives is not a speaker note. */
function isDirectiveComment(inner) {
  const lines = inner.split('\n').map((l) => l.trim()).filter(Boolean);
  return lines.length > 0 && lines.every((line) => {
    const key = line.match(/^_?([A-Za-z]+)\s*:/);
    return key && DIRECTIVES.has(key[1].toLowerCase());
  });
}

/** Ranges `[start, end)` of the text that are inside fenced code blocks. */
function fencedRanges(text) {
  const ranges = [];
  let open = null, at = 0;
  for (const line of text.split('\n')) {
    const fence = line.match(/^ {0,3}(`{3,}|~{3,})/);
    if (fence && !open) open = { mark: fence[1], start: at };
    else if (fence && fence[1][0] === open.mark[0] && fence[1].length >= open.mark.length) {
      ranges.push([open.start, at + line.length]);
      open = null;
    }
    at += line.length + 1;
  }
  if (open) ranges.push([open.start, text.length]);
  return ranges;
}

/** Separates the speaker notes (comments that are not directives) from the rest of the slide. */
function splitNotes(text) {
  const fences = fencedRanges(text), notes = [];
  const body = text.replace(/<!--([\s\S]*?)-->/g, (whole, inner, at) => {
    if (isDirectiveComment(inner) || fences.some(([from, to]) => at >= from && at < to)) return whole;
    notes.push(inner.trim());
    return '';
  });
  if (!notes.length) return { body: text, notes: '' };
  return { body: body.replace(/\n{3,}/g, '\n\n').trim(), notes: notes.join('\n\n') };
}

/** The inverse of `splitNotes`: the notes go back as one comment at the end of the slide. */
function joinNotes(body, notes) {
  const clean = notes.trim().replace(/-->/g, '-- >');
  return clean ? `${body.trimEnd()}\n\n<!--\n${clean}\n-->` : body;
}

/** Markdown coloured as HTML, with exactly the same characters as the text. */
function highlight(text) {
  const esc = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const span = (kind, t) => `<span class="hl-${kind}">${t}</span>`;
  const inline = (t) => esc(t)
    .replace(/(`+)[^`]*\1/g, (m) => span('code', m))
    .replace(/!?\[[^\]\n]*\]\([^)\n]*\)/g, (m) => span('lk', m));
  let fence = null, comment = false;
  return text.split('\n').map((line) => {
    const mark = line.match(/^ {0,3}(`{3,}|~{3,})/);
    if (fence) {
      if (mark && mark[1][0] === fence[0] && mark[1].length >= fence.length) fence = null;
      return span('code', esc(line));
    }
    if (comment || /^\s*<!--/.test(line)) {
      comment = !/-->/.test(line.slice(comment ? 0 : line.indexOf('<!--') + 4));
      return span('cm', esc(line));
    }
    if (mark) { fence = mark[1]; return span('code', esc(line)); }
    if (/^ {0,3}#{1,6}(\s|$)/.test(line)) return span('hd', esc(line));
    if (/^ {0,3}([-*_])( *\1){2,} *$/.test(line)) return span('hr', esc(line));
    const item = line.match(/^(\s*)([-*+]|\d+[.)])(\s.*)?$/);
    if (item) return esc(item[1]) + span('mk', esc(item[2])) + inline(item[3] || '');
    return inline(line);
  }).join('\n');
}

/**
 * After saving edits the server renumbers the slides. Returns the function that takes a
 * history item (`{k, id, text?, fresh?}`, with old ids) to the new numbering.
 * `saved` are the items that were written; if each became one slide, the position is the id.
 */
function makeRemap(oldSlides, newSlides, saved, base) {
  const origin = new Map(), byText = new Map();
  if (saved.length === newSlides.length) {
    saved.forEach((item, at) => { if (!item.fresh && !origin.has(item.id)) origin.set(item.id, at); });
  }
  newSlides.forEach((slide, id) => { if (!byText.has(slide.text)) byText.set(slide.text, id); });
  return (item) => {
    const text = item.text ?? oldSlides[item.id].text;
    const id = item.fresh ? undefined : origin.get(item.id);
    if (id !== undefined) return newSlides[id].text === text ? { k: item.k, id } : { k: item.k, id, text };
    if (byText.has(text)) return { k: item.k, id: byText.get(text) };
    return { k: item.k, id: base, text, fresh: true };
  };
}

/** Every word of the query appears in the text, ignoring case. */
function matchesQuery(text, query) {
  const hay = text.toLowerCase();
  return query.toLowerCase().split(/\s+/).filter(Boolean).every((word) => hay.includes(word));
}

/** Text of `key` in language `lang`, with `{0}`, `{1}`… replaced by the arguments. */
function translate(lang, key, args) {
  const text = (lang === 'pt' ? PT[key] : undefined) ?? EN[key] ?? key;
  return text.replace(/\{(\d)\}/g, (_, n) => args[n]);
}

// </pure>

const $ = (s) => document.querySelector(s);
const grid = $('#grid'), bar = $('#bar');

let tabs = [];           // open files: [{doc, file, dir, path}] + the state kept when switching tabs
let cur = null;          // active tab; the variables below are its state
let S = null;            // state from the server
let items = [];          // current order: [{k: card key, id: slide, text: if edited}]
let sel = new Set();     // selected keys
let anchor = null;       // last clicked card
let undo = [], redo = [];
let nextKey = 1;
let offline = false;
let lang = 'en';         // interface language: 'en' or 'pt'
const t = (key, ...args) => translate(lang, key, args);
const slidesN = (n) => (n === 1 ? t('{0} slide', n) : t('{0} slides', n));
let query = '';          // search text
let clip = null;         // copied slides: {doc, texts}
const draftKeys = new Map();   // text of an unsaved slide -> key of its thumbnail on the server
const cards = new Map(); // key -> element

const post = (url, body) => fetch(url, {
  method: 'POST',
  headers: { 'Content-Type': 'application/json', 'X-Marp-Order': '1' },
  body: JSON.stringify(body || {}),
});

function toast(message) {
  const el = $('#toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove('show'), 4000);
}

const sameOrder = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);
const dirtyOf = (state, list) => !!state &&
  (!sameOrder(list.map((it) => it.id), state.disk_order) || list.some((it) => it.text != null));
const isDirty = () => dirtyOf(S, items);
const tabDirty = (tab) => (tab === cur ? isDirty() : dirtyOf(tab.S, tab.items || []));
/** How many slides of the file are no longer in the list. */
const removedCount = () => S.disk_order.filter((id) => !items.some((it) => it.id === id && !it.fresh)).length;
const textOf = (item) => item.text ?? S.slides[item.id].text;
const entry = (item) => (item.text == null ? { id: item.id } : { id: item.id, text: item.text });

const titleOf = (item) => (item.text == null ? S.slides[item.id].title : slideTitle(item.text));
const selected = () => items.filter((it) => sel.has(it.k));
const cardList = () => [...grid.querySelectorAll('.card')];

function adopt(state) {
  S = state;
  items = S.disk_order.map((id) => ({ k: nextKey++, id }));
  sel = new Set(); anchor = null; undo = []; redo = [];
  cards.forEach((el) => el.remove());
  cards.clear();
  cur.file = S.file;
  cur.path = S.path;
  document.title = S.file + ' — marp-order';
  document.body.classList.remove('nodoc');
  render();
  showStatus(S);
}

function commit(next) {
  if (sameOrder(next, items)) return;
  undo.push(items);
  redo = [];
  items = next;
  render();
}

function thumbSrc(id) {
  return `/thumb/${cur.doc}/${id}?g=${S.generation}&v=${S.thumbs.version}`;
}

/** Thumbnail of the item: the one on disk or, if it was edited, the draft one once it is ready. */
function faceSrc(item) {
  if (item.text != null) {
    const key = draftKeys.get(item.text);
    if (key && S.thumbs.drafts.includes(key)) return `/thumb/${cur.doc}/d-${key}`;
    if (item.fresh) return '';
  }
  return S.thumbs.have[item.id] ? thumbSrc(item.id) : '';
}

let draftTimer = null;
/** Asks the server, in the background, for the thumbnails of edited or added slides. */
function requestDrafts() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(async () => {
    const tab = cur, list = items;
    if (!S || S.thumbs.state === 'off') return;
    const ready = (text) => draftKeys.has(text) && S.thumbs.drafts.includes(draftKeys.get(text));
    const need = list.filter((it) => it.text != null && !ready(it.text)).map((it) => it.text);
    const asked = S.generation + '\u0000' + need.join('\u0000');
    if (!need.length || tab.asked === asked) return;
    tab.asked = asked;
    try {
      const res = await post('/api/draft', { doc: tab.doc, generation: S.generation, slides: list.map(entry) });
      if (!res.ok) return;
      (await res.json()).keys.forEach((key, at) => { if (key) draftKeys.set(list[at].text, key); });
    } catch {}
  }, 700);
}

function makeCard(item) {
  const slide = S.slides[item.id];
  const el = document.createElement('div');
  el.className = 'card';
  el.draggable = true;
  el.dataset.k = item.k;

  const face = document.createElement('div');
  face.className = 'face';
  const foot = document.createElement('footer');
  const num = document.createElement('span'); num.className = 'num';
  const title = document.createElement('span'); title.className = 'title';
  const was = document.createElement('span'); was.className = 'was';
  foot.append(num, title);
  if (slide.warn.length) {
    const flag = document.createElement('span');
    flag.className = 'flag';
    flag.textContent = '⚠';
    flag.title = slide.warn.map((warn) => (warn.kind === 'directives'
      ? t('Directive that applies from this slide onwards: {0}. Moving this slide changes which slides are affected.', warn.names.join(', '))
      : t('With headingDivider, the comment before the heading moves to the previous slide if this one stops being the first.'))).join('\n');
    foot.append(flag);
  }
  foot.append(was);
  el.append(face, foot);
  return el;
}

/** Updates the title and face of the card; the face is only rebuilt when the content changes. */
function paint(el, item) {
  const text = titleOf(item);
  const title = el.querySelector('.title');
  title.textContent = text || t('(untitled)');
  title.title = text;
  title.classList.toggle('empty', !text);
  el.classList.toggle('changed', item.text != null);

  const face = el.querySelector('.face');
  const src = faceSrc(item);
  const key = lang + src + '\n' + (item.text ?? '');
  if (face.dataset.key === key) return;
  face.dataset.key = key;
  const badge = document.createElement('span');
  badge.className = 'edited';
  badge.textContent = item.fresh ? t('added') : t('edited');
  badge.title = t('Its thumbnail is rendered in the background.');
  let content;
  if (src) {
    content = document.createElement('img');
    content.src = src; content.alt = ''; content.loading = 'lazy'; content.draggable = false;
  } else {
    content = document.createElement('div');
    content.className = 'text';
    content.textContent = textOf(item).slice(0, 600) || t('(empty slide)');
  }
  face.replaceChildren(content, badge);
}

function render() {
  const alive = new Set(items.map((it) => it.k));
  for (const [k, el] of cards) if (!alive.has(k)) { el.remove(); cards.delete(k); }
  sel = new Set([...sel].filter((k) => alive.has(k)));

  items.forEach((item, i) => {
    let el = cards.get(item.k);
    if (!el) { el = makeCard(item); cards.set(item.k, el); }
    paint(el, item);
    el.querySelector('.num').textContent = i + 1;
    const origin = item.fresh ? -1 : S.disk_order.indexOf(item.id);
    const was = el.querySelector('.was');
    was.textContent = origin < 0 ? t('new') : origin !== i ? t('was {0}', origin + 1) : '';
    el.classList.toggle('dim', !!query && !matchesQuery(titleOf(item) + '\n' + textOf(item), query));
    if (grid.children[i + 1] !== el) grid.insertBefore(el, grid.children[i + 1] || null);
  });
  renderSel();
  requestDrafts();
}

function renderSel() {
  for (const [k, el] of cards) el.classList.toggle('sel', sel.has(k));
  const dirty = isDirty();
  const removed = removedCount();
  const info = $('#info');
  info.textContent = slidesN(items.length) + (sel.size > 1 ? ' · ' + t('{0} selected', sel.size) : '');
  if (query) info.textContent += ' · ' + t('{0} found', grid.querySelectorAll('.card:not(.dim)').length);
  if (dirty) {
    const mark = document.createElement('span');
    mark.className = 'dirty';
    mark.textContent = ' · ' + t('unsaved changes') + (removed ? ` (${t('{0} removed', removed)})` : '');
    info.append(mark);
  }
  $('#save').disabled = !dirty;
  $('#discard').disabled = !dirty;
  $('#undo').disabled = !undo.length;
  $('#redo').disabled = !redo.length;
  $('#dup').disabled = $('#del').disabled = !sel.size;
  renderTabs();
}

function showStatus(status) {
  $('#external').hidden = !(status.external_change || S.stale);
  $('#external span').textContent = S.stale
    ? t('This file was saved from another marp-order window.')
    : t('The file was changed outside marp-order.');
  const th = status.thumbs;
  $('#mismatch').hidden = th.state !== 'mismatch';
  $('#mismatch span').textContent =
    t('Warning: {0}. The slides may be split incorrectly — check the file before saving a new order.', th.message);
  $('#thumbnote').hidden = th.state !== 'error';
  $('#thumbnote span').textContent = t('Thumbnails unavailable ({0}). Showing the slide text instead.', th.message);
  $('#save').textContent = th.state === 'rendering' ? t('Save (rendering thumbnails…)') : t('Save');
}

// ---- operations on the order -------------------------------------------------

/** Moves the selected slides to position `at`, counted among the unselected ones. */
function moveSelection(at) {
  const moving = selected();
  const rest = items.filter((it) => !sel.has(it.k));
  at = Math.max(0, Math.min(rest.length, at));
  commit([...rest.slice(0, at), ...moving, ...rest.slice(at)]);
}

function shiftSelection(delta) {
  const first = items.findIndex((it) => sel.has(it.k));
  if (first < 0) return;
  const before = items.slice(0, first).filter((it) => !sel.has(it.k)).length;
  moveSelection(before + delta);
  cards.get(selected()[0].k).scrollIntoView({ block: 'nearest' });
}

function removeSelection() {
  if (sel.size) commit(items.filter((it) => !sel.has(it.k)));
}

function duplicateSelection() {
  if (!sel.size) return;
  const next = [], fresh = new Set();
  for (const it of items) {
    next.push(it);
    if (sel.has(it.k)) { const copy = { ...it, k: nextKey++ }; next.push(copy); fresh.add(copy.k); }
  }
  sel = fresh;
  commit(next);
}

function stepHistory(from, to) {
  if (!from.length) return;
  to.push(items);
  items = from.pop();
  render();
}

function select(k, event) {
  if (event.shiftKey && anchor !== null) {
    const a = items.findIndex((it) => it.k === anchor), b = items.findIndex((it) => it.k === k);
    if (a >= 0) {
      sel = new Set(items.slice(Math.min(a, b), Math.max(a, b) + 1).map((it) => it.k));
      return renderSel();
    }
  }
  if (event.ctrlKey || event.metaKey) {
    sel.has(k) ? sel.delete(k) : sel.add(k);
  } else {
    sel = new Set([k]);
  }
  anchor = k;
  renderSel();
}

// ---- drag and drop -----------------------------------------------------------

function dropIndex(x, y) {
  let n = 0;
  for (const el of cardList()) {
    const r = el.getBoundingClientRect();
    if (r.bottom < y || (r.top <= y && r.left + r.width / 2 < x)) n++;
  }
  return n;
}

function showBar(index, y) {
  const list = cardList(), prev = list[index - 1], next = list[index];
  const g = grid.getBoundingClientRect();
  let r, x;
  const prevRect = prev && prev.getBoundingClientRect();
  if (prevRect && (!next || (prevRect.top <= y && y <= prevRect.bottom))) {
    r = prevRect; x = r.right + 5;
  } else if (next) {
    r = next.getBoundingClientRect(); x = r.left - 9;
  } else {
    return;
  }
  Object.assign(bar.style, {
    display: 'block', left: x - g.left + 'px', top: r.top - g.top + 'px', height: r.height + 'px',
  });
}

let dragging = false;
grid.addEventListener('dragstart', (e) => {
  const el = e.target.closest('.card');
  if (!el) return;
  const k = Number(el.dataset.k);
  if (!sel.has(k)) { sel = new Set([k]); anchor = k; renderSel(); }
  dragging = true;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(sel.size));
  requestAnimationFrame(() => {
    if (dragging) sel.forEach((s) => cards.get(s)?.classList.add('dragging'));
  });
});
grid.addEventListener('dragover', (e) => {
  if (!dragging) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  showBar(dropIndex(e.clientX, e.clientY), e.clientY);
});
grid.addEventListener('drop', (e) => {
  if (!dragging) return;
  e.preventDefault();
  const index = dropIndex(e.clientX, e.clientY);
  moveSelection(items.slice(0, index).filter((it) => !sel.has(it.k)).length);
});
grid.addEventListener('dragend', () => {
  dragging = false;
  bar.style.display = 'none';
  cards.forEach((el) => el.classList.remove('dragging'));
});

grid.addEventListener('click', (e) => {
  const el = e.target.closest('.card');
  if (el) return select(Number(el.dataset.k), e);
  sel = new Set(); renderSel();
});
grid.addEventListener('dblclick', (e) => {
  const el = e.target.closest('.card');
  if (el) openEditor(items.find((it) => it.k === Number(el.dataset.k)));
});

// ---- slide and front-matter editor -------------------------------------------

const editor = $('#editor'), edtext = $('#edtext'), ednotes = $('#ednotes'), edview = $('#edview');
let editing = null;      // {mode: 'slide' | 'head', k, initial, body, notes, busy, again}

function showEditor(title, help) {
  $('#edtitle').textContent = title;
  $('#edhelp').innerHTML = help;
  editor.classList.toggle('head', editing.mode === 'head');
  $('#edapply').textContent = editing.mode === 'head' ? t('Save') : t('Apply');
  // when moving between slides the dialog is already open and the old preview stays
  // on screen until the new one has loaded
  if (!editor.open) {
    edview.replaceChildren();
    editor.showModal();
  }
  paintEditor();
  edtext.focus();
  edtext.setSelectionRange(0, 0);
  edtext.scrollTop = 0;
  refreshPreview();
}

function openEditor(item) {
  const initial = textOf(item);
  editing = { mode: 'slide', k: item.k, initial, ...splitNotes(initial) };
  edtext.value = editing.body;
  ednotes.value = editing.notes;
  const at = items.indexOf(item);
  $('#edprev').disabled = at === 0;
  $('#ednext').disabled = at === items.length - 1;
  showEditor(t('Slide {0} of {1}', at + 1, items.length), t('help.slide'));
}

/** Applies the edit and moves the editor to the previous or next slide without closing it. */
function stepEditor(delta) {
  if (!editing || editing.mode !== 'slide') return;
  const k = editing.k, text = editedText();
  const next = items[items.findIndex((it) => it.k === k) + delta];
  if (!next) return;
  commit(items.map((it) => (it.k !== k || text === textOf(it) ? it : withText(it, text))));
  sel = new Set([next.k]);
  anchor = next.k;
  renderSel();
  cards.get(next.k).scrollIntoView({ block: 'nearest' });
  openEditor(items.find((it) => it.k === next.k));
}

/** The front matter applies to the whole file and is written at once, outside the history. */
function openHead() {
  if (isDirty()) return toast(t('Save or discard your changes before editing the front matter.'));
  editing = { mode: 'head', initial: S.head.trim() };
  edtext.value = editing.initial;
  ednotes.value = '';
  showEditor(t('Front matter'), t('help.head'));
}

/** Text being edited; unchanged, it returns the original byte for byte (notes stay where they were). */
function editedText() {
  if (editing.mode === 'head') return edtext.value.trim();
  if (edtext.value === editing.body && ednotes.value === editing.notes) return editing.initial;
  return joinNotes(edtext.value, ednotes.value).trim();
}

function paintEditor() {
  $('#edhl').innerHTML = highlight(edtext.value) + '\n';
  $('#edhl').scrollTop = edtext.scrollTop;
}

function edStatus(message, isError) {
  const el = $('#edstatus');
  el.textContent = message;
  el.classList.toggle('error', !!isError);
}

/** Asks the server for the rendered draft; there is never more than one request in flight. */
async function refreshPreview() {
  const session = editing;
  if (!session) return;
  if (session.busy) { session.again = true; return; }
  session.busy = true;
  edStatus(t('updating…'));
  try {
    const request = { doc: cur.doc, generation: S.generation };
    if (session.mode === 'head') {
      const head = editedText();
      Object.assign(request, { slides: items.map(entry), index: 0, head: head ? head + '\n' : '' });
    } else {
      const text = editedText();
      request.slides = items.map((it) => (it.k === session.k ? { id: it.id, text } : entry(it)));
      request.index = items.findIndex((it) => it.k === session.k);
    }
    const res = await post('/api/preview', request);
    const body = await res.json();
    if (editing === session) {
      if (res.ok) { showPreview(`/preview/slide.html?page=${body.page}&t=${Date.now()}`); edStatus(session.error || '', !!session.error); }
      else edStatus(body.error, true);
    }
  } catch {
    if (editing === session) edStatus(t('no response from marp-order'), true);
  }
  session.busy = false;
  if (editing === session && session.again) { session.again = false; refreshPreview(); }
}

/** Loads the new version underneath and only then swaps, so the slide does not flicker. */
function showPreview(src) {
  const next = document.createElement('iframe');
  next.className = 'loading';
  next.title = t('Slide preview');
  next.onload = () => {
    for (const old of [...edview.children]) if (old !== next) old.remove();
    next.classList.remove('loading');
  };
  next.src = src;
  edview.append(next);
}

function closeEditor() {
  editing = null;
  editor.close();
  edview.replaceChildren();
}

async function saveHead(force) {
  const tab = cur, session = editing;
  let res, body;
  try {
    res = await post('/api/head', { doc: tab.doc, head: editedText(), force: !!force });
    body = await res.json();
  } catch {
    return edStatus(t('no response from marp-order'), true);
  }
  if (editing !== session || cur !== tab) return;
  if (res.status === 409) {
    if (confirm(t('The file was changed outside marp-order since it was opened.\n\nOK: overwrite it (a copy of the current file is kept).\nCancel: do not save.'))) return saveHead(true);
    return;
  }
  if (!res.ok) { session.error = body.error; return edStatus(body.error, true); }
  closeEditor();
  adopt(body);
  toast(t('Front matter saved.'));
}

/** Applies the edit; returns `false` when it went to the server (front matter). */
function applyEdit() {
  if (editing.mode === 'head') { saveHead(false); return false; }
  const k = editing.k, text = editedText();
  closeEditor();
  commit(items.map((it) => {
    if (it.k !== k || text === textOf(it)) return it;
    return withText(it, text);
  }));
  return true;
}

function cancelEdit() {
  const changed = editedText() !== editing.initial.trim();
  if (!changed || confirm(t('Discard the changes?'))) closeEditor();
}

let edTimer = null;
const edited = () => {
  if (editing) editing.error = '';
  paintEditor();
  clearTimeout(edTimer);
  edTimer = setTimeout(refreshPreview, 200);
};
edtext.addEventListener('input', edited);
ednotes.addEventListener('input', edited);
edtext.addEventListener('scroll', () => { $('#edhl').scrollTop = edtext.scrollTop; });
new ResizeObserver(paintEditor).observe(edtext);
editor.addEventListener('cancel', (e) => { e.preventDefault(); cancelEdit(); });
editor.addEventListener('keydown', (e) => {
  if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    // also keeps the browser from going back or forward in its history
    e.preventDefault();
    return stepEditor(e.key === 'ArrowLeft' ? -1 : 1);
  }
  if (!(e.ctrlKey || e.metaKey)) return;
  const key = e.key.toLowerCase();
  if (key !== 'enter' && key !== 's') return;
  // without this the global Ctrl+S shortcut would save a second time
  e.preventDefault();
  e.stopPropagation();
  if (applyEdit() && key === 's') save(false);
});
$('#edapply').onclick = applyEdit;
$('#edcancel').onclick = cancelEdit;
$('#fm').onclick = openHead;
$('#edprev').onclick = () => stepEditor(-1);
$('#ednext').onclick = () => stepEditor(1);

// ---- server ------------------------------------------------------------------

async function save(force) {
  if (!isDirty()) return;
  const tab = cur, saved = items;
  const removed = removedCount();
  if (removed && !force && !confirm(t('{0} slide(s) will be removed from the file. Continue?', removed))) return;
  let res;
  try {
    res = await post('/api/save', {
      doc: tab.doc, generation: S.generation, save_seq: S.save_seq, slides: saved.map(entry), force: !!force,
    });
  } catch {
    return toast(t('Could not reach marp-order.'));
  }
  const body = await res.json();
  if (cur !== tab) { tab.S = null; return; }   // switched tabs: it is re-read when the user comes back
  if (res.status === 409 && (body.error === 'external_change' || body.error === 'stale')) {
    const ask = body.error === 'stale'
      ? t('The file was saved from another marp-order window since it was loaded here.\n\nOK: overwrite it with what you see here (a copy of the current file is kept).\nCancel: do not save.')
      : t('The file was changed outside marp-order since it was loaded here.\n\nOK: overwrite it with what you see here (a copy of the current file is kept).\nCancel: do not save.');
    if (confirm(ask)) return save(true);
    return;
  }
  if (!res.ok) return toast(t('Could not save: {0}', body.error));
  if (body.generation !== S.generation) {
    // content was edited: the server re-read the file and renumbered the slides
    await rebase(tab, saved);
  } else {
    S.disk_order = body.disk_order;
    S.thumbs = body.thumbs;
    S.save_seq = body.save_seq;
    S.stale = false;
    render();
    showStatus(body);
  }
  toast(t('File saved. Backup of the original: {0}', body.backup.split(/[\\/]/).slice(-2).join('/')));
}

/** Adopts the rewritten file without losing the undo history or the selection. */
async function rebase(tab, saved) {
  const res = await fetch(`/api/state?doc=${tab.doc}`);
  if (!res.ok) return dropTab(tab);
  const state = await res.json();
  if (cur !== tab) { tab.S = null; return; }
  const remap = makeRemap(S.slides, state.slides, saved, state.disk_order[0] ?? 0);
  const whole = saved.length === state.slides.length;
  undo = undo.map((list) => list.map(remap));
  redo = redo.map((list) => list.map(remap));
  // what was just written is, by definition, what is on disk
  items = whole ? saved.map((it, id) => ({ k: it.k, id })) : state.disk_order.map((id) => ({ k: nextKey++, id }));
  S = state;
  cards.forEach((el) => el.remove());
  cards.clear();
  render();
  showStatus(S);
}

async function reload() {
  if (isDirty() && !confirm(t('Reloading discards your unsaved changes. Continue?'))) return;
  const tab = cur;
  const res = await post('/api/reload', { doc: tab.doc });
  const body = await res.json();
  if (cur !== tab) return;
  if (!res.ok) return toast(t('Could not reload: {0}', body.error));
  tab.autoFailed = false;
  adopt(body);
  toast(t('File reloaded from disk.'));
}

async function refetch(tab) {
  const res = await fetch(`/api/state?doc=${tab.doc}`);
  if (!res.ok) return dropTab(tab);
  const state = await res.json();
  if (cur === tab) adopt(state);
}

async function poll() {
  const tab = cur;
  let res, status;
  try {
    res = await fetch(tab ? `/api/status?doc=${tab.doc}` : '/api/docs');
    status = await res.json();
  } catch {
    offline = true;
    $('#offline').hidden = false;
    return;
  }
  if (offline) { offline = false; $('#offline').hidden = true; }
  if (!tab || cur !== tab) return;
  if (res.status === 404) return dropTab(tab);   // closed in another window
  if (!S) return;
  if (status.generation !== S.generation || status.save_seq !== S.save_seq) {
    // another window wrote this file: with nothing pending here, just follow along
    if (isDirty() || editing) S.stale = true;
    else if (status.generation !== S.generation) return refetch(tab);
    else {
      const pool = items.slice();
      items = status.disk_order.map((id) => {
        const at = pool.findIndex((it) => it.id === id);
        return at < 0 ? { k: nextKey++, id } : pool.splice(at, 1)[0];
      });
      S.disk_order = status.disk_order;
      S.save_seq = status.save_seq;
      render();
    }
  }
  if (status.external_change && wantsAutoReload(tab)) return autoReload(tab);
  const fresh = status.thumbs.version !== S.thumbs.version || status.thumbs.drafts.length !== S.thumbs.drafts.length;
  S.thumbs = status.thumbs;
  S.external_change = status.external_change;
  if (fresh) { for (const item of items) paint(cards.get(item.k), item); requestDrafts(); }
  showStatus(status);
}

/** The file changed on disk; with nothing pending here it can simply be read again. */
const wantsAutoReload = (tab) => $('#auto').checked && !tab.autoFailed && !isDirty() && !editing &&
  !differ.open && !dragging;

async function autoReload(tab) {
  let res, body;
  try {
    res = await post('/api/reload', { doc: tab.doc });
    body = await res.json();
  } catch {
    return;
  }
  if (cur !== tab || isDirty() || editing) return;
  if (!res.ok) {
    // e.g. caught in the middle of a write: leave the warning up instead of retrying forever
    tab.autoFailed = true;
    return toast(t('Could not reload: {0}', body.error));
  }
  const chosen = new Set(items.map((it, at) => (sel.has(it.k) ? at : -1)));
  adopt(body);
  // the same positions stay selected, which is usually the same slides
  sel = new Set(items.filter((_, at) => chosen.has(at)).map((it) => it.k));
  renderSel();
  toast(t('The file changed on disk and was reloaded.'));
}

/** Text of slides from another file, with the image paths adjusted for this one. */
async function importTexts(from, to, texts) {
  if (from === to || !texts.length) return texts;
  try {
    const res = await post('/api/import', { from, to, texts });
    if (res.ok) return (await res.json()).texts;
  } catch {}
  return texts;
}

// ---- copy, cut, paste and find -----------------------------------------------

/** A slide that did not come from this file; `id` only says which slide to copy the spacing from. */
const foreignIn = (state, text) => ({ k: nextKey++, id: state.disk_order[0] ?? 0, text, fresh: true });
const foreign = (text) => foreignIn(S, text);
const withText = (item, text) => (text === S.slides[item.id].text && !item.fresh
  ? { k: item.k, id: item.id } : { ...item, text });

function copySelection(cut) {
  const texts = selected().map(textOf);
  if (!texts.length) return;
  clip = { doc: cur.doc, texts };
  navigator.clipboard?.writeText(texts.join('\n\n---\n\n')).catch(() => {});
  if (cut) removeSelection();
  const count = slidesN(texts.length);
  toast(cut ? t('{0} cut. Ctrl+V pastes, in this or another tab.', count) : t('{0} copied. Ctrl+V pastes, in this or another tab.', count));
}

async function paste() {
  if (!clip) return;
  if (!S.slides.length) return toast(t('This file has no slides to paste next to.'));
  const tab = cur;
  const texts = await importTexts(clip.doc, tab.doc, clip.texts);
  if (cur !== tab) return;
  const fresh = texts.map(foreign);
  const last = items.reduce((at, it, i) => (sel.has(it.k) ? i : at), items.length - 1);
  sel = new Set(fresh.map((it) => it.k));
  commit([...items.slice(0, last + 1), ...fresh, ...items.slice(last + 1)]);
  cards.get(fresh[0].k).scrollIntoView({ block: 'nearest' });
}

/** Copies slides to the end of another tab (dragging onto the tab), as a pending change there. */
async function copyToTab(tab, texts) {
  const from = cur.doc;
  if (!tab.S) {
    const res = await fetch(`/api/state?doc=${tab.doc}`);
    if (!res.ok) return dropTab(tab);
    const state = await res.json();
    Object.assign(tab, { S: state, items: state.disk_order.map((id) => ({ k: nextKey++, id })),
      sel: new Set(), anchor: null, undo: [], redo: [] });
  }
  if (!tab.S.slides.length) return toast(t('{0} has no slides to add next to.', tab.file));
  texts = await importTexts(from, tab.doc, texts);
  if (tab === cur) return;
  tab.undo.push(tab.items);
  tab.redo = [];
  tab.items = [...tab.items, ...texts.map((text) => foreignIn(tab.S, text))];
  renderTabs();
  toast(t('{0} copied to the end of {1}.', slidesN(texts.length), tab.file));
}

const find = $('#find');
find.addEventListener('input', () => { query = find.value.trim(); render(); });
find.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { find.value = ''; query = ''; render(); find.blur(); }
  if (e.key !== 'Enter' || !query) return;
  // Enter walks through the matches
  const hits = items.filter((it) => !cards.get(it.k).classList.contains('dim'));
  if (!hits.length) return;
  const at = hits.findIndex((it) => it.k === anchor);
  const next = hits[(at + (e.shiftKey ? hits.length - 1 : 1)) % hits.length];
  sel = new Set([next.k]); anchor = next.k;
  renderSel();
  cards.get(next.k).scrollIntoView({ block: 'center' });
});

// ---- tabs --------------------------------------------------------------------

function renderTabs() {
  const nav = $('#tabs');
  nav.querySelectorAll('.tab').forEach((el) => el.remove());
  for (const tab of tabs) {
    const el = document.createElement('div');
    el.className = 'tab' + (tab === cur ? ' on' : '') + (tabDirty(tab) ? ' dirty' : '');
    el.title = tab.path;
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = tab.file;
    const x = document.createElement('button');
    x.className = 'x';
    x.textContent = '×';
    x.title = t('Close this file');
    x.onclick = (e) => { e.stopPropagation(); closeTab(tab); };
    el.onclick = () => { if (tab !== cur) activate(tab); };
    el.ondragover = (e) => { if (dragging && tab !== cur) { e.preventDefault(); el.classList.add('drop'); } };
    el.ondragleave = () => el.classList.remove('drop');
    el.ondrop = (e) => { e.preventDefault(); el.classList.remove('drop'); copyToTab(tab, selected().map(textOf)); };
    el.append(name, x);
    nav.insertBefore(el, $('#open'));
  }
  $('#empty').hidden = tabs.length > 0;
  $('#compare').disabled = !S || tabs.length < 2;
  $('#fm').disabled = !S;
}

/** Switches tabs, keeping the unsaved order, edits and history in the previous one. */
async function activate(tab) {
  if (cur) Object.assign(cur, { S, items, sel, anchor, undo, redo });
  cur = tab;
  cards.forEach((el) => el.remove());
  cards.clear();
  if (tab && tab.S) {
    ({ S, items, sel, anchor, undo, redo } = tab);
    document.title = S.file + ' — marp-order';
    document.body.classList.remove('nodoc');
    render();
    showStatus(S);
    return poll();
  }
  S = null; items = []; sel = new Set(); anchor = null; undo = []; redo = [];
  document.title = 'marp-order';
  document.body.classList.add('nodoc');
  renderTabs();
  if (tab) await refetch(tab);
}

function dropTab(tab) {
  const at = tabs.indexOf(tab);
  if (at < 0) return;
  tabs.splice(at, 1);
  if (cur !== tab) return renderTabs();
  cur = null;
  activate(tabs[at] || tabs[at - 1] || null);
}

async function closeTab(tab) {
  if (tabDirty(tab) && !confirm(t('{0} has unsaved changes. Close it anyway?', tab.file))) return;
  try { await post('/api/close', { doc: tab.doc }); } catch {}
  dropTab(tab);
}

// ---- open a file -------------------------------------------------------------

const openDlg = $('#opener');

function fileButton(label, hint, action) {
  const li = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = label;
  if (hint) {
    const small = document.createElement('small');
    small.textContent = hint;
    button.append(small);
    button.title = hint;
  }
  button.onclick = action;
  li.append(button);
  return li;
}

async function openDialog() {
  $('#operror').textContent = '';
  openDlg.showModal();
  const info = await (await fetch('/api/docs')).json();
  const recent = info.recent.map((file) => fileButton(file.file, file.dir, () => openFile(file.path)));
  if (!recent.length) {
    const none = document.createElement('li');
    none.textContent = t('Nothing yet.');
    recent.push(none);
  }
  $('#oprecent').replaceChildren(...recent);
  browse(cur ? cur.dir : '');
}

async function browse(dir) {
  const res = await post('/api/browse', { dir });
  const body = await res.json();
  if (!res.ok) return void ($('#operror').textContent = body.error);
  if (body.file) return openFile(body.file);
  $('#operror').textContent = '';
  $('#oppath').value = body.dir;
  const list = body.entries.map((entry) => (entry.dir
    ? fileButton('📁 ' + entry.name, '', () => browse(entry.path))
    : fileButton(entry.name, '', () => openFile(entry.path))));
  if (body.parent) list.unshift(fileButton('📁 ..', '', () => browse(body.parent)));
  $('#oplist').replaceChildren(...list);
}

async function openFile(path) {
  const res = await post('/api/open', { path });
  const body = await res.json();
  if (!res.ok) {
    if (openDlg.open) $('#operror').textContent = body.error; else toast(body.error);
    return;
  }
  let tab = tabs.find((t) => t.doc === body.doc);
  if (!tab) { tab = body; tabs.push(tab); }
  if (openDlg.open) openDlg.close();
  if (tab !== cur) activate(tab); else renderTabs();
}

$('#opform').onsubmit = (e) => { e.preventDefault(); browse($('#oppath').value.trim()); };
$('#opclose').onclick = () => openDlg.close();
$('#open').onclick = $('#openempty').onclick = openDialog;

// ---- compare and merge -------------------------------------------------------

const differ = $('#differ');
let other = null;        // state (as saved on disk) of the file being compared

const rightSlides = () => other.disk_order.map((id) => other.slides[id]);
const diffRows = (right) => alignSlides(items.map((it) => ({ text: textOf(it), title: titleOf(it) })), right);

function mini(number, title, src, text) {
  const el = document.createElement('div');
  el.className = 'mini';
  let face;
  if (src) {
    face = document.createElement('img');
    face.src = src; face.alt = '';
  } else {
    face = document.createElement('div');
    face.className = 'text';
    face.textContent = text.slice(0, 500) || t('(empty slide)');
  }
  const foot = document.createElement('footer');
  const num = document.createElement('strong');
  num.textContent = number;
  const name = document.createElement('span');
  name.className = 'title';
  name.textContent = title || t('(untitled)');
  foot.append(num, name);
  el.append(face, foot);
  return el;
}

/** Line-by-line difference between two texts: what is only here and what is only in the other. */
function diffBlock(label, mine, theirs) {
  const details = document.createElement('details');
  const summary = document.createElement('summary');
  summary.textContent = label;
  const block = document.createElement('div');
  block.className = 'dfdiff';
  for (const line of lineDiff(mine, theirs)) {
    const row = document.createElement('div');
    if (line.kind !== 'same') row.className = line.kind;
    row.textContent = line.text;
    block.append(row);
  }
  details.append(summary, block);
  return details;
}

function renderDiff() {
  $('#dfundo').disabled = !undo.length;
  if (!other) return;
  const right = rightSlides();
  const rows = diffRows(right);
  const count = (kind) => rows.filter((row) => row.kind === kind).length;
  const parts = [[count('changed'), '{0} different'], [count('left'), '{0} only here'], [count('right'), '{0} only in the other']]
    .filter(([n]) => n).map(([n, label]) => t(label, n));
  $('#dfsummary').textContent = parts.length ? parts.join(' · ') : t('Both files have the same slides.');
  $('#dfall').disabled = !parts.length || !S.slides.length;

  const leftCard = (l) => mini(l + 1, titleOf(items[l]), faceSrc(items[l]), textOf(items[l]));
  const rightCard = (r) => {
    const slide = right[r];
    const src = other.thumbs.have[slide.id]
      ? `/thumb/${other.doc}/${slide.id}?g=${other.generation}&v=${other.thumbs.version}` : '';
    return mini(r + 1, slide.title, src, slide.text);
  };
  const action = (label, title, run) => {
    const button = document.createElement('button');
    button.textContent = label;
    button.title = title;
    button.disabled = !S.slides.length;
    button.onclick = async () => { button.disabled = true; await run(); renderDiff(); };
    return button;
  };
  const theirs = async (r) => (await importTexts(other.doc, cur.doc, [right[r].text]))[0];
  const blank = () => document.createElement('span');
  const only = $('#dfonly').checked;

  const list = rows.filter((row) => !only || row.kind !== 'same').map((row) => {
    const el = document.createElement('div');
    el.className = 'dfrow ' + row.kind;
    const mid = document.createElement('div');
    mid.className = 'mid';
    if (row.kind === 'same') {
      mid.textContent = '=';
      el.append(leftCard(row.l), mid, rightCard(row.r));
    } else if (row.kind === 'changed') {
      const key = items[row.l].k;
      mid.append(t('different'), action(t('← Use other'), t('Replace this slide with the one from the other file'),
        async () => { const text = await theirs(row.r); commit(items.map((it) => (it.k === key ? withText(it, text) : it))); }));
      el.append(leftCard(row.l), mid, rightCard(row.r),
        diffBlock(t('Show what differs'), textOf(items[row.l]), right[row.r].text));
    } else if (row.kind === 'left') {
      const key = items[row.l].k;
      mid.append(t('only here'), action(t('Remove'), t('Remove this slide from this file'),
        () => commit(items.filter((it) => it.k !== key))));
      el.append(leftCard(row.l), mid, blank());
    } else {
      mid.append(t('only in the other'), action(t('← Add'), t('Copy this slide into this file, at this position'),
        async () => { const text = await theirs(row.r); commit([...items.slice(0, row.at), foreign(text), ...items.slice(row.at)]); }));
      el.append(blank(), mid, rightCard(row.r));
    }
    return el;
  });
  if (norm(S.head) !== norm(other.head)) {
    const el = document.createElement('div');
    el.className = 'dfrow head';
    el.append(t('The front matter (theme and global settings) differs. It is not merged: use the Front matter button to edit it.'),
      diffBlock(t('Show what differs'), S.head, other.head));
    list.unshift(el);
  }
  $('#dfrows').replaceChildren(...list);
}

/** Makes the slides of this tab match the other file, in a single undoable step. */
async function takeAll() {
  const right = rightSlides(), rows = diffRows(right), base = items;
  const wanted = rows.filter((row) => row.kind === 'changed' || row.kind === 'right');
  const texts = await importTexts(other.doc, cur.doc, wanted.map((row) => right[row.r].text));
  if (items !== base) return;
  const next = [];
  for (const row of rows) {
    if (row.kind === 'same') next.push(items[row.l]);
    else if (row.kind === 'changed') next.push(withText(items[row.l], texts[wanted.indexOf(row)]));
    else if (row.kind === 'right') next.push(foreign(texts[wanted.indexOf(row)]));
  }
  commit(next);
  renderDiff();
}

async function loadOther() {
  const res = await fetch(`/api/state?doc=${$('#dfother').value}`);
  if (!res.ok) { other = null; $('#dfrows').replaceChildren(); $('#dfsummary').textContent = t('That file is no longer open.'); return; }
  other = await res.json();
  renderDiff();
}

function openDiffer() {
  if (!S || tabs.length < 2) return;
  $('#dfleft').textContent = cur.file;
  $('#dfother').replaceChildren(...tabs.filter((tab) => tab !== cur).map((tab) => {
    const option = document.createElement('option');
    option.value = tab.doc;
    option.textContent = tab.file;
    option.title = tab.path;
    return option;
  }));
  other = null;
  $('#dfrows').replaceChildren();
  differ.showModal();
  loadOther();
}

$('#compare').onclick = openDiffer;
$('#dfother').onchange = loadOther;
$('#dfonly').onchange = renderDiff;
$('#dfall').onclick = takeAll;
$('#dfundo').onclick = () => { stepHistory(undo, redo); renderDiff(); };
$('#dfclose').onclick = () => differ.close();

// ---- controls ----------------------------------------------------------------

$('#save').onclick = () => save(false);
$('#undo').onclick = () => stepHistory(undo, redo);
$('#redo').onclick = () => stepHistory(redo, undo);
$('#dup').onclick = duplicateSelection;
$('#del').onclick = removeSelection;
$('#discard').onclick = () => commit(S.disk_order.map((id) => ({ k: nextKey++, id })));
$('#reload').onclick = reload;
$('#rethumb').onclick = () => post('/api/rethumb', { doc: cur.doc }).then(poll);

/** Puts the fixed texts of the page in the current language and redraws what depends on it. */
function applyLang() {
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
  document.querySelectorAll('[data-t]').forEach((el) => { el.innerHTML = t(el.dataset.t); });
  document.querySelectorAll('[data-tt]').forEach((el) => { el.title = t(el.dataset.tt); });
  document.querySelectorAll('[data-tp]').forEach((el) => { el.placeholder = t(el.dataset.tp); });
  $('#save').textContent = t('Save');
  if (!S) return renderTabs();
  // the warnings on the cards are built when the cards are created
  cards.forEach((el) => el.remove());
  cards.clear();
  render();
  showStatus(S);
}

const auto = $('#auto');
try { auto.checked = localStorage.getItem('marp-order-auto') !== 'off'; } catch {}
auto.onchange = () => {
  try { localStorage.setItem('marp-order-auto', auto.checked ? 'on' : 'off'); } catch {}
  if (cur) cur.autoFailed = false;
  poll();
};

const langSel = $('#lang');
try { lang = localStorage.getItem('marp-order-lang') || ''; } catch {}
if (lang !== 'en' && lang !== 'pt') lang = (navigator.language || '').toLowerCase().startsWith('pt') ? 'pt' : 'en';
langSel.value = lang;
langSel.onchange = () => {
  lang = langSel.value;
  try { localStorage.setItem('marp-order-lang', lang); } catch {}
  applyLang();
};
applyLang();

const size = $('#size');
const applySize = () => document.documentElement.style.setProperty('--w', size.value + 'px');
try { size.value = localStorage.getItem('marp-order-size') || size.value; } catch {}
applySize();
size.oninput = () => {
  applySize();
  try { localStorage.setItem('marp-order-size', size.value); } catch {}
};

document.addEventListener('keydown', (e) => {
  if (editor.open || openDlg.open || differ.open) return;
  const mod = e.ctrlKey || e.metaKey;
  const key = e.key.toLowerCase();
  if (mod && key === 'o') { e.preventDefault(); return openDialog(); }
  if (!S) return;
  if (mod && key === 'f') { e.preventDefault(); find.focus(); return find.select(); }
  if (e.target === find) return;   // in the search box, keys are text
  let handled = true;
  if (mod && key === 's') save(false);
  else if (mod && key === 'z' && !e.shiftKey) stepHistory(undo, redo);
  else if (mod && (key === 'y' || (key === 'z' && e.shiftKey))) stepHistory(redo, undo);
  else if (mod && key === 'd') duplicateSelection();
  else if (mod && key === 'c' && sel.size) copySelection(false);
  else if (mod && key === 'x' && sel.size) copySelection(true);
  else if (mod && key === 'v' && clip) paste();
  else if (mod && key === 'a') { sel = new Set(items.map((it) => it.k)); renderSel(); }
  else if (key === 'delete' || key === 'backspace') removeSelection();
  else if (mod && key === 'r' && !e.shiftKey) reload();
  else if (key === 'escape') { sel = new Set(); renderSel(); }
  else if (e.altKey && key === 'arrowleft') shiftSelection(-1);
  else if (e.altKey && key === 'arrowright') shiftSelection(1);
  else if (e.altKey && key === 'home') moveSelection(0);
  else if (e.altKey && key === 'end') moveSelection(items.length);
  else if (key === 'arrowleft' || key === 'arrowright') {
    const at = items.findIndex((it) => it.k === anchor);
    const next = items[Math.max(0, Math.min(items.length - 1, at + (key === 'arrowleft' ? -1 : 1)))];
    if (next) { sel = new Set([next.k]); anchor = next.k; renderSel(); cards.get(next.k).scrollIntoView({ block: 'nearest' }); }
  }
  else handled = false;
  if (handled) e.preventDefault();
});

window.addEventListener('beforeunload', (e) => {
  if (!offline && tabs.some(tabDirty)) { e.preventDefault(); e.returnValue = ''; }
});

fetch('/api/docs').then((r) => r.json()).then((info) => {
  tabs = info.docs;
  activate(tabs[0] || null);
  if (!tabs.length) openDialog();
  setInterval(poll, 1500);
});
</script>
