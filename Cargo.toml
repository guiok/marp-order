[package]
name = "marp-order"
version = "0.3.2"
edition = "2021"
description = "Visual slide sorter for Marp decks: reorder, edit, compare and merge slides in the browser"
license = "MIT"
readme = "README.md"
repository = "https://github.com/guiok/marp-order"
homepage = "https://github.com/guiok/marp-order"
exclude = [".github/", "docs/*.gif", "docs/*.png", "Makefile"]
rust-version = "1.80"
keywords = ["marp", "slides", "markdown", "presentation"]
categories = ["command-line-utilities"]

[dependencies]
tiny_http = "0.12"
serde_json = "1"

[profile.release]
strip = true
