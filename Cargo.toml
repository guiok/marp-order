[package]
name = "marp-order"
version = "0.2.0"
edition = "2021"
description = "Reorganiza as lâminas de uma apresentação Marp em uma matriz visual"
license = "MIT"
readme = "README.md"
rust-version = "1.80"
keywords = ["marp", "slides", "markdown", "presentation"]
